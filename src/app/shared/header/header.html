<header class="sticky top-0 z-50 border-b border-(--color-border) bg-(--color-header-bg)">
  <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6">

    <!-- Logo -->
    <a routerLink="/home" class="text-xl font-bold tracking-tight text-(--color-text)" (click)="closeMenu()">
      MMC Innovations
    </a>


    <!-- Desktop Navigation -->
    <nav class="hidden items-center gap-8 lg:flex">

      <!-- Home -->
      <a routerLink="Home" routerLinkActive="!text-(--color-primary)" [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm font-medium text-(--color-text-secondary) transition hover:text-(--color-primary)">
        Home
      </a>

      <!-- About -->
      <a routerLink="About" routerLinkActive="!text-(--color-primary)" [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm font-medium text-(--color-text-secondary) transition hover:text-(--color-primary)">
        About
      </a>

      <!-- Solutions -->
      <a routerLink="Solutions" routerLinkActive="!text-(--color-primary)" [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm font-medium text-(--color-text-secondary) transition hover:text-(--color-primary)">
        Solutions
      </a>

      <!-- SuperMinds -->
      <a routerLink="SuperMinds" routerLinkActive="!text-(--color-primary)" [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm font-medium text-(--color-text-secondary) transition hover:text-(--color-primary)">
        SuperMinds
      </a>

      <!-- Technology -->
      <a routerLink="Technology" routerLinkActive="!text-(--color-primary)" [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm font-medium text-(--color-text-secondary) transition hover:text-(--color-primary)">
        Technology
      </a>

      <!-- Contact -->
      <a routerLink="Contact" routerLinkActive="!text-(--color-primary)" [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm font-medium text-(--color-text-secondary) transition hover:text-(--color-primary)">
        Contact
      </a>

    </nav>


    <!-- Desktop Actions -->
    <div class="hidden items-center gap-3 lg:flex">

      <!-- ================================================= -->
      <!-- Figma Style Theme Toggle -->
      <!-- ================================================= -->

<!-- Theme Toggle -->
<button
  type="button"
  (click)="toggleTheme()"
  class="relative flex h-10 w-[88px] items-center rounded-full border border-(--color-border) bg-(--color-bg-secondary) p-1"
  [attr.aria-label]="
    isDark ? 'Switch to light theme' : 'Switch to dark theme'
  "
  [attr.title]="
    isDark ? 'Switch to light theme' : 'Switch to dark theme'
  "
>

  <!-- Active Round Indicator -->
  <span
    class="absolute left-1 top-1 h-8 w-8 rounded-full bg-(--color-card-bg) shadow-sm transition-transform duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]"
    [class.translate-x-11]="isDark"
  ></span>


  <!-- Sun -->
  <span
    class="relative z-10 flex h-8 w-8 items-center justify-center transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]"
    [class.scale-110]="!isDark"
    [class.opacity-100]="!isDark"
    [class.rotate-0]="!isDark"
    [class.text-(--color-primary)]="!isDark"
    [class.scale-75]="isDark"
    [class.opacity-40]="isDark"
    [class.rotate-45]="isDark"
    [class.text-(--color-text-muted)]="isDark"
  >
    <i class="pi pi-sun text-[15px]"></i>
  </span>


  <!-- Moon -->
  <span
    class="relative z-10 flex h-8 w-8 items-center justify-center transition-all duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]"
    [class.scale-110]="isDark"
    [class.opacity-100]="isDark"
    [class.rotate-0]="isDark"
    [class.text-(--color-primary)]="isDark"
    [class.scale-75]="!isDark"
    [class.opacity-40]="!isDark"
    [class.-rotate-45]="!isDark"
    [class.text-(--color-text-muted)]="!isDark"
  >
    <i class="pi pi-moon text-[15px]"></i>
  </span>

</button>


      <!-- CTA -->
      <a routerLink="Contact"
        class="rounded-full bg-(--color-button-bg) px-6 py-3 text-sm font-semibold text-(--color-button-text) transition hover:bg-(--color-primary)">
        Let's Talk
      </a>

    </div>


    <!-- Mobile Actions -->
    <div class="flex items-center gap-2 lg:hidden">

      <!-- Mobile Menu -->
      <button type="button"
        class="flex h-10 w-10 items-center justify-center rounded-lg text-(--color-text) transition hover:bg-(--color-bg-secondary)"
        (click)="toggleMenu()" aria-label="Toggle navigation">

        @if (menuOpen()) {
        <span class="text-2xl leading-none">×</span>
        } @else {
        <span class="text-2xl leading-none">☰</span>
        }

      </button>

    </div>

  </div>
