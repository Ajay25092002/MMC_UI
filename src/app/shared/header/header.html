<header class="sticky top-0 z-50 border-b  border-slate-200 bg-white">
  <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6">

    <!-- Logo -->
    <a
      routerLink="/home"
      class="text-xl font-bold tracking-tight text-slate-900"
      (click)="closeMenu()"
    >
      MMC Innovations
    </a>

    <!-- Desktop Navigation -->
    <nav class="hidden items-center gap-8 lg:flex">

      <a
        routerLink="/home"
        routerLinkActive="text-teal-600"
        [routerLinkActiveOptions]="{ exact: true }"
        class="text-sm font-medium text-slate-700 transition hover:text-teal-600"
      >
        Home
      </a>

      <a
        routerLink="/about"
        routerLinkActive="text-teal-600"
        class="text-sm font-medium text-slate-700 transition hover:text-teal-600"
      >
        About
      </a>

      <a
        routerLink="/solutions"
        routerLinkActive="text-teal-600"
        class="text-sm font-medium text-slate-700 transition hover:text-teal-600"
      >
        Solutions
      </a>

      <a
        routerLink="/superminds"
        routerLinkActive="text-teal-600"
        class="text-sm font-medium text-slate-700 transition hover:text-teal-600"
      >
        SuperMinds
      </a>

      <a
        routerLink="/technology"
        routerLinkActive="text-teal-600"
        class="text-sm font-medium text-slate-700 transition hover:text-teal-600"
      >
        Technology
      </a>

      <a
        routerLink="/contact"
        routerLinkActive="text-teal-600"
        class="text-sm font-medium text-slate-700 transition hover:text-teal-600"
      >
        Contact
      </a>

    </nav>

    <!-- Desktop CTA -->
    <a
      routerLink="/contact"
      class="hidden rounded-full bg-slate-900 px-6 py-3 text-sm font-semibold text-white transition hover:bg-teal-600 lg:block"
    >
      Let's Talk
    </a>

    <!-- Mobile Menu Button -->
    <button
      type="button"
      class="flex h-10 w-10 items-center justify-center rounded-lg hover:bg-slate-100 lg:hidden"
      (click)="toggleMenu()"
      aria-label="Toggle navigation"
    >
      @if (menuOpen()) {
        <span class="text-2xl">×</span>
      } @else {
        <span class="text-2xl">☰</span>
      }
    </button>

  </div>

  <!-- Mobile Navigation -->
  @if (menuOpen()) {

    <div class="border-t border-slate-200 bg-white lg:hidden">

      <nav class="flex flex-col gap-1 px-6 py-4">

        <a
          routerLink="/home"
          routerLinkActive="bg-teal-50 text-teal-700"
          [routerLinkActiveOptions]="{ exact: true }"
          class="rounded-lg px-4 py-3 text-sm font-medium text-slate-700"
          (click)="closeMenu()"
        >
          Home
        </a>

        <a
          routerLink="/about"
          class="rounded-lg px-4 py-3 text-sm font-medium text-slate-700"
          (click)="closeMenu()"
        >
          About
        </a>

        <a
          routerLink="/solutions"
          class="rounded-lg px-4 py-3 text-sm font-medium text-slate-700"
          (click)="closeMenu()"
        >
          Solutions
        </a>

        <a
          routerLink="/superminds"
          class="rounded-lg px-4 py-3 text-sm font-medium text-slate-700"
          (click)="closeMenu()"
        >
          SuperMinds
        </a>

        <a
          routerLink="/technology"
          class="rounded-lg px-4 py-3 text-sm font-medium text-slate-700"
          (click)="closeMenu()"
        >
          Technology
        </a>

        <a
          routerLink="/contact"
          class="rounded-lg px-4 py-3 text-sm font-medium text-slate-700"
          (click)="closeMenu()"
        >
          Contact
        </a>

        <a
          routerLink="/contact"
          class="mt-3 rounded-full bg-slate-900 px-6 py-3 text-center text-sm font-semibold text-white"
          (click)="closeMenu()"
        >
          Let's Talk
        </a>

      </nav>

    </div>

  }

</header>
